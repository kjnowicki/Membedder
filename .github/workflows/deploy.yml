name: Deploy Membedder

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-membedder
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Checkout main
        uses: actions/checkout@v4

      - name: Build and restart Membedder container
        shell: bash
        env:
          RUNTIME_DIR: ${{ vars.MEMBEDDER_RUNTIME_DIR || '/mnt/d/Projects/Repos/Membedder/_deploy' }}
        run: |
          set -euo pipefail

          # Normalize Windows-style path if MEMBEDDER_RUNTIME_DIR was set with drive letter
          RUNTIME_DIR="${RUNTIME_DIR//\\//}"
          RUNTIME_DIR="${RUNTIME_DIR%/}"
          if [[ "$RUNTIME_DIR" =~ ^([A-Za-z]):/(.*)$ ]]; then
            drive="${BASH_REMATCH[1],,}"
            RUNTIME_DIR="/mnt/${drive}/${BASH_REMATCH[2]}"
          fi
          export RUNTIME_DIR

          echo "Using runtime directory: $RUNTIME_DIR"
          if [ ! -f "$RUNTIME_DIR/.env" ]; then
            echo "ERROR: Missing .env file at '$RUNTIME_DIR/.env'." >&2
            exit 1
          fi

          mkdir -p "$RUNTIME_DIR/cookies" "$RUNTIME_DIR/data"

          if docker compose version >/dev/null 2>&1; then
            COMPOSE="docker compose"
          else
            COMPOSE="docker-compose"
          fi

          # 1. Build new image first so the running bot stays online if the build fails
          $COMPOSE -p membedder build

          # 2. Remove any pre-existing container (handles migration from an older compose project name)
          if [ -n "$(docker ps -aq -f 'name=^membedder-container$')" ]; then
            docker rm -f membedder-container >/dev/null
          fi

          # 3. Start updated container
          $COMPOSE -p membedder up -d --force-recreate

          # 4. Clean up dangling images from previous builds
          docker image prune -f >/dev/null
          docker ps -f 'name=^membedder-container$'
